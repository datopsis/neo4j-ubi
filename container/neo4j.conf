# Fixed first-increment profile. Memory and authentication are appended by the guard.
server.default_listen_address=0.0.0.0
server.bolt.enabled=true
server.bolt.listen_address=:7687
server.http.enabled=true
server.http.listen_address=:7474
server.https.enabled=false
server.directories.data=/data
server.directories.transaction.logs.root=/data/transactions
server.directories.logs=/run/neo4j
server.directories.run=/run/neo4j
server.directories.import=/import
server.directories.plugins=/opt/neo4j/plugins
server.logs.config=/run/neo4j/server-logs.xml
server.logs.user.config=/run/neo4j/user-logs.xml
dbms.security.allow_csv_import_from_file_urls=false
dbms.security.procedures.allowlist=
dbms.security.procedures.unrestricted=
dbms.usage_report.enabled=false
server.config.strict_validation.enabled=true
server.jvm.additional=-Djava.io.tmpdir=/tmp
server.jvm.additional=-XX:+ExitOnOutOfMemoryError
server.jvm.additional=-XX:ErrorFile=/run/neo4j/hs_err_pid%p.log
dbms.fleet_manager.enabled=false
server.fleet_discovery.enabled=false
server.http.x_forward.enabled=false
